<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Capri app icon master: her face (icon-art.png, a square crop) on a rounded tile with a purple rim.
       gen-icons.ts inlines icon-art.png as a data URI before rendering. -->
  <defs>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <!-- macOS-style inset tile (824px on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000"/>
  <image href="icon-art.png" x="100" y="100" width="824" height="824" preserveAspectRatio="xMidYMid slice" clip-path="url(#tile)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#8536C9" stroke-width="8"/>
</svg>
